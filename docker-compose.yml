version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=rag_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data: